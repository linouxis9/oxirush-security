name: Mutants

# cargo-mutants changes the code of the crate at one place at a time, a mutant, and
# runs the tests on each: a mutant that every test passes is code that no test checks.
# .cargo/mutants.toml says what it leaves alone, and why. Every mutant runs each Saturday
# evening, and when the run is started by hand with `full`; on the other nights after a
# day with a commit, and when it is started by hand without `full`, the mutants of the
# code that the commits of the last day changed. Each job keeps its mutants.out, and a
# missed mutant fails it. The crates of the family start at times of their own, the
# longest first, and few jobs of each run at once, to leave runners to the other CI;
# started by hand, `parallel` says how many. A shard takes every n-th mutant, so that
# the shards of a job last alike, and they are as many as keep each to 2 hours or less.
on:
  schedule:
    - cron: "43 21 * * 6"
    - cron: "23 1 * * 1-6"
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the last day's changes
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than the weekly number
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The runners have AVX2: tests/implementation.rs fails when another code runs.
  OXIRUSH_SECURITY_EXPECT: Vector256

jobs:
  # What the run mutates: every mutant, the mutants of what the commits of the last day
  # changed since the last commit before them, or nothing after a day without a commit.
  plan:
    name: What to mutate
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          WEEKLY: "43 21 * * 6"
          SCHEDULE: ${{ github.event.schedule }}
          FULL: ${{ inputs.full }}
        run: |
          # The last commit before the last day, or the empty tree
          base=$(git rev-list -1 --before="24 hours ago" HEAD)
          base=${base:-$(git hash-object -t tree /dev/null)}
          if [ "$SCHEDULE" = "$WEEKLY" ] || [ "$FULL" = true ]; then
            mode=full
          elif [ "$base" != "$(git rev-parse HEAD)" ]; then
            mode=diff
          else
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  # The lines that no test reaches: the summary of each file in the log, and each line
  # in the report that the job keeps (cargo-llvm-cov 0.9.1): once in each run that
  # mutates something.
  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-features --html
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info

  mutants:
    name: Mutants (shard ${{ matrix.shard }} of 8)
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      # A test of a mutant that allocates without end fails once it has 4 GiB of
      # address space, instead of taking the memory of the runner, which then dies.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '2') }}
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # cargo-mutants exits with 3 when a mutant made a test run until its timeout,
      # before it says whether a mutant was missed: a mutant that makes a test loop
      # forever is one that the tests see, and missed.txt has those that they do not.
      - run: |
          cargo mutants --shard ${{ matrix.shard }}/8 --sharding round-robin -j 2 || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out

  # The mutants of the lines that the commits of the last day changed.
  changes:
    name: Mutants of the last day's changes
    needs: plan
    if: needs.plan.outputs.mode == 'diff'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: |
          git diff ${{ needs.plan.outputs.base }} HEAD > "$RUNNER_TEMP/changes.diff"
          cargo mutants --in-diff "$RUNNER_TEMP/changes.diff" -j 2 || [ $? -eq 3 ]
          test ! -s mutants.out/missed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-changes
          path: mutants.out


  # After the shards, the vector code of AArch64, which .cargo/mutants.toml leaves out
  # on x86-64: its detection answering false runs the scalar code, which
  # tests/implementation.rs refuses on a processor that has the instructions; and the
  # shuffle of ShiftRows of indices above 15, which TBL reads as zeros where PSHUFB of
  # x86-64 reads their four low bits.
  aarch64:
    name: Mutants of the AArch64 code
    needs: [plan, mutants]
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04-arm
    env:
      OXIRUSH_SECURITY_EXPECT: Vector128
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: >-
          cargo mutants --no-config --all-features -j 2 -f src/common/simd/mod.rs
          -f src/common/simd/tables.rs
          -F 'mod\.rs:172:5: replace detected -> bool with false$|tables\.rs:88:60: replace % with \+$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-aarch64
          path: mutants.out

  # After the shards, what is cleared after a piece of work, and the hooks that only
  # leftovers/ and the fuzz targets build (the stack pointer that leftovers/ reads
  # among them), which .cargo/mutants.toml leaves out: leftovers/ alone sees them. Each mutant is made in the tree, the program is built
  # and run with it, and the tree is put back.
  leftovers:
    name: Mutants of the clearing, with leftovers/ (shard ${{ matrix.shard }} of 2)
    needs: [plan, mutants]
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '2') }}
      matrix:
        shard: [0, 1]
    env:
      RUSTFLAGS: --cfg oxirush_security_hooks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: >-
          cargo mutants --no-config --all-features --list --json --diff
          -f src/common/wipe.rs -f src/lib.rs -f src/common/simd/mod.rs
          -F 'Clear<DEPTH>|in after$|hooks::|allowed::|stack_pointer|mod\.rs:221:5: replace clear with \(\)$'
          -E 'replace Clear<DEPTH>::now with|wipe\.rs:242:16:'
          > leftovers-mutants.json
      - run: python3 .github/mutants-leftovers.py leftovers-mutants.json ${{ matrix.shard }} 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-leftovers-${{ matrix.shard }}
          path: |
            leftovers-mutants.json
            leftovers-missed.txt

  # After the shards, the clearing of AArch64, which .cargo/mutants.toml leaves out:
  # x86-64 does not build it. emulated-aarch64/ runs the crate on an emulated AArch64
  # processor, and fails when an area that the crate cleared, or a vector register,
  # is not zero. The mutant is made in the tree as in the job `leftovers`.
  emulated-aarch64:
    name: Mutants of the AArch64 clearing, on an emulated processor
    needs: [plan, mutants]
    if: always() && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: >-
          cargo mutants --no-config --all-features --list --json --diff
          -f src/common/simd/mod.rs -F 'mod\.rs:340:5: replace clear with \(\)$'
          > emulated-mutants.json
      - run: python3 .github/mutants-leftovers.py emulated-mutants.json 0 1 emulated-aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-emulated-aarch64
          path: |
            emulated-mutants.json
            leftovers-missed.txt
