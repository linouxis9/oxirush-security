name: Mutants

# The mutation testing of the crate: the jobs of crate-mutants.yml of oxirush-aper,
# which every crate of the family calls, here with 8 shards, and the mutants of the
# AArch64 code and of the clearing after them. The workflow is run by hand before a
# release: with `full`, every mutant; without it, the mutants of the code that the
# commits since the last run changed, and none without such a commit; with `recheck`,
# the mutants that a file of the repository names, as a missed.txt has them, again at
# the head. .cargo/mutants.toml says what it leaves alone, and why.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Every mutant, rather than those of the changes since the last run
        type: boolean
        default: false
      parallel:
        description: The shards of each job that run at once, rather than one
        type: string
        default: ""
      recheck:
        description: A file of the repository that names mutants, one a line, to run again at the head
        type: string
        default: ""

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Without debug information each mutant builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The runners have AVX2: tests/implementation.rs fails when another code runs.
  OXIRUSH_SECURITY_EXPECT: Vector256

jobs:
  mutants:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-mutants.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      shards: 8
      full: ${{ inputs.full }}
      parallel: ${{ inputs.parallel }}
      recheck: ${{ inputs.recheck }}
      # The runners have AVX2: tests/implementation.rs fails when another code runs.
      setup: echo "OXIRUSH_SECURITY_EXPECT=Vector256" >> "$GITHUB_ENV"

  # After the shards, the vector code of AArch64, which .cargo/mutants.toml leaves out
  # on x86-64: its detection answering false runs the scalar code, which
  # tests/implementation.rs refuses on a processor that has the instructions; and the
  # shuffle of ShiftRows of indices above 15, which TBL reads as zeros where PSHUFB of
  # x86-64 reads their four low bits.
  aarch64:
    name: Mutants of the AArch64 code
    needs: mutants
    if: always() && needs.mutants.outputs.mode == 'full'
    runs-on: ubuntu-24.04-arm
    env:
      OXIRUSH_SECURITY_EXPECT: Vector128
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: >-
          cargo mutants --no-config --all-features -j 2 -f src/common/simd/mod.rs
          -f src/common/simd/tables.rs
          -F 'mod\.rs:172:5: replace detected -> bool with false$|tables\.rs:88:60: replace % with \+$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-aarch64
          path: mutants.out

  # After the shards, what is cleared after a piece of work, and the hooks that only
  # leftovers/ and the fuzz targets build (the stack pointer that leftovers/ reads
  # among them), which .cargo/mutants.toml leaves out: leftovers/ alone sees them. Each mutant is made in the tree, the program is built
  # and run with it, and the tree is put back.
  leftovers:
    name: Mutants of the clearing, with leftovers/ (shard ${{ matrix.shard }} of 2)
    needs: mutants
    if: always() && needs.mutants.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '1') }}
      matrix:
        shard: [0, 1]
    env:
      RUSTFLAGS: --cfg oxirush_security_hooks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # The mutants are named by their function, and by the column of the hook of the
      # targets other than x86-64 and AArch64, as .cargo/mutants.toml names it. simd/mod.rs
      # has a `clear` for x86-64 and one for AArch64, of the same name: the one of x86-64
      # is the one whose diff removes its instructions.
      - run: >-
          cargo mutants --no-config --all-features --list --json --diff
          -f src/common/wipe.rs -f src/lib.rs -f src/common/simd/mod.rs
          -F 'Clear<DEPTH>|in after$|hooks::|allowed::|stack_pointer|mod\.rs:.*: replace clear with \(\)$'
          -E 'replace Clear<DEPTH>::now with|wipe\.rs:\d+:16: delete ! in Clear<DEPTH>::clear$'
          | jq '[.[] | select((.name | endswith(": replace clear with ()") | not)
          or (.diff | contains("vzeroall")))]'
          > leftovers-mutants.json
      - run: python3 .github/mutants-leftovers.py leftovers-mutants.json ${{ matrix.shard }} 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-leftovers-${{ matrix.shard }}
          path: |
            leftovers-mutants.json
            leftovers-missed.txt

  # After the shards, the clearing of AArch64, which .cargo/mutants.toml leaves out:
  # x86-64 does not build it. emulated-aarch64/ runs the crate on an emulated AArch64
  # processor, and fails when an area that the crate cleared, or a vector register,
  # is not zero. The mutant is made in the tree as in the job `leftovers`.
  emulated-aarch64:
    name: Mutants of the AArch64 clearing, on an emulated processor
    needs: mutants
    if: always() && needs.mutants.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # The `clear` of AArch64, of the same name as that of x86-64: the one whose diff
      # removes the instructions of AArch64.
      - run: >-
          cargo mutants --no-config --all-features --list --json --diff
          -f src/common/simd/mod.rs -F 'mod\.rs:.*: replace clear with \(\)$'
          | jq '[.[] | select(.diff | contains("stp xzr, xzr"))]'
          > emulated-mutants.json
      - run: python3 .github/mutants-leftovers.py emulated-mutants.json 0 1 emulated-aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-emulated-aarch64
          path: |
            emulated-mutants.json
            leftovers-missed.txt
