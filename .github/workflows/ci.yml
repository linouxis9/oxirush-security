name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Each Monday: an advisory may be new although nothing has changed here,
  # and the fuzz targets then run for half an hour each
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `tests/implementation.rs` fails in a job that does not run the code
  # that `OXIRUSH_SECURITY_EXPECT` names, and prints what runs.
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Vector256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test implementation -- --nocapture
      - run: cargo test
      - run: cargo test --release
      # Each set of features. The processor is asked without `std` too
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features alloc
      - run: cargo test --no-default-features --features std
      - run: cargo test --no-default-features --features suci
      # The instructions enabled by the build, as on a target without an
      # operating system
      - name: Test with the instructions enabled by the build
        env:
          RUSTFLAGS: -C target-feature=+ssse3,+sse4.1,+aes,+pclmulqdq,+avx2
        run: cargo test --no-default-features
      # Without the clearing of the stack and of the registers that
      # follows a piece of work
      - name: Test without the clearing
        env:
          RUSTFLAGS: --cfg oxirush_security_unwiped
        run: cargo test

  # The code on the vector and AES instructions of AArch64, which the tests
  # compare with the scalar one: with the processor asked, with and without
  # `std`, and with the instructions enabled by the build
  aarch64:
    name: Test (AArch64)
    runs-on: ubuntu-24.04-arm
    env:
      OXIRUSH_SECURITY_EXPECT: Vector128
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test implementation -- --nocapture
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features
      - name: Test with the instructions enabled by the build
        env:
          RUSTFLAGS: -C target-feature=+neon,+aes
        run: cargo test --no-default-features

  # The vector code of AArch64 on an emulated processor: Unicorn, which its
  # crate builds from its source, runs the crate as a program for a bare
  # AArch64 processor with NEON and the AES instructions, and the program
  # compares that code with its scalar code and with this machine's
  emulated-aarch64:
    name: AArch64 code on an emulated processor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            emulated-aarch64/guest
            emulated-aarch64/host
      - run: emulated-aarch64/run.sh

  # What an operation leaves on the stack and in the registers of x86-64:
  # `leftovers/` runs each public operation that handles a key, looks for
  # its keys and its keystream where it was, and measures how deep it went
  # against what the crate clears. A release build, then builds that lay
  # the code out otherwise.
  leftovers:
    name: Leftovers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release build
            toolchain: stable
            arguments: --release
          - name: release build, Rust 1.88
            toolchain: 1.88.0
            arguments: --release
          - name: AES and SHA-256 without their instructions
            toolchain: stable
            arguments: --release
            cfg: --cfg aes_backend="soft" --cfg sha2_backend="soft"
          - name: one codegen unit and link-time optimization
            toolchain: stable
            arguments: >-
              --release --config profile.release.codegen-units=1
              --config profile.release.lto=true
          - name: optimized for size
            toolchain: stable
            arguments: --release --config 'profile.release.opt-level="s"'
          # The scan itself stays optimized: what it does after an
          # operation must not write on the stack that it reads
          - name: the crate and its dependencies not optimized
            toolchain: stable
            arguments: >-
              --release --config 'profile.release.package."*".opt-level=0'
              --config 'profile.release.package."*".debug-assertions=true'
    env:
      RUSTFLAGS: --cfg oxirush_security_hooks ${{ matrix.cfg }}
    defaults:
      run:
        working-directory: leftovers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: leftovers
      - run: cargo run ${{ matrix.arguments }}
      - run: cargo clippy --all-targets -- -D warnings

  # The 5G AKA chain from another implementation: the HMAC-SHA-256 of
  # Python's standard library derives the values, and the script fails
  # when one is not the value that the crate's test expects
  reference-values:
    name: The 5G AKA chain from another implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/five_g_aka_chain.py

  # The advisories of RustSec against the versions that a new user of the
  # crate gets today
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there. A library needs no source of random
  # numbers to be built: the program that links it names one.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    env:
      RUSTFLAGS: --cfg getrandom_backend="custom"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features alloc
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features suci
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features nai

  # A target that has the scalar code alone, and 32-bit lengths
  scalar:
    name: Test (32-bit x86, scalar code alone)
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Scalar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --target i686-unknown-linux-gnu --test implementation -- --nocapture
      - run: cargo test --target i686-unknown-linux-gnu

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Vector256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features

  # The lowest version of each dependency that Cargo.toml allows: each set
  # of features on the host, and those without `std` on a target without it
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features alloc
      - run: cargo test --no-default-features --features std
      - run: cargo test --no-default-features --features suci
      - name: Build without std
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: |
          cargo build --target thumbv7em-none-eabihf --no-default-features
          cargo build --target thumbv7em-none-eabihf --no-default-features --features alloc
          cargo build --target thumbv7em-none-eabihf --no-default-features --features suci
          cargo build --target thumbv7em-none-eabihf --no-default-features --features nai

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features suci -- -D warnings
      - name: Clippy without the clearing
        env:
          RUSTFLAGS: --cfg oxirush_security_unwiped
        run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # As docs.rs builds it
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
      # A link to an item that a feature brings is broken without it
      - name: Doc of each set of features
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in "" alloc std suci nai; do
            echo "::group::--no-default-features --features \"$features\""
            cargo doc --no-deps --no-default-features --features "$features"
            echo "::endgroup::"
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path emulated-aarch64/guest/Cargo.toml
      - run: cargo fmt --check --manifest-path emulated-aarch64/host/Cargo.toml
      - run: cargo fmt --check --manifest-path leftovers/Cargo.toml

  # A minute for each target at a push, half an hour each Monday
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [suci, suci_round_trip, identity, algorithms]
    env:
      # The target `algorithms` compares the vector paths with the scalar
      # code through the crate's hooks
      RUSTFLAGS: --cfg oxirush_security_hooks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The first directory takes what the run finds; the second has the seeds.
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - run: >
          cargo fuzz run ${{ matrix.target }}
          fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          --
          -max_total_time=${{ github.event_name == 'schedule' && 1800 || 60 }}
          -max_len=512

  bench:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # Each benchmark once, without timing: the figures of a shared runner
      # say nothing
      - run: cargo test --manifest-path benches/Cargo.toml --benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No cache: its action looks for build directories under `tests/` of
      # the unpacked package, and reports each one that is missing as an
      # error of the job
      - run: cargo publish --dry-run
