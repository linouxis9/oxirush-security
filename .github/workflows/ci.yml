name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `tests/implementation.rs` fails in a job that does not run the code
  # that `OXIRUSH_SECURITY_EXPECT` names, and prints what runs.
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Vector256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test implementation -- --nocapture
      - run: cargo test
      - run: cargo test --release
      # Each set of features. The processor is asked without `std` too
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features alloc
      - run: cargo test --no-default-features --features std
      - run: cargo test --no-default-features --features suci
      # The instructions enabled by the build, as on a target without an
      # operating system
      - name: Test with the instructions enabled by the build
        env:
          RUSTFLAGS: -C target-feature=+ssse3,+sse4.1,+aes,+pclmulqdq,+avx2
        run: cargo test --no-default-features

  # The code on the vector and AES instructions of AArch64, which the tests
  # compare with the scalar one: with the processor asked, with and without
  # `std`, and with the instructions enabled by the build
  aarch64:
    name: Test (AArch64)
    runs-on: ubuntu-24.04-arm
    env:
      OXIRUSH_SECURITY_EXPECT: Vector128
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test implementation -- --nocapture
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features
      - name: Test with the instructions enabled by the build
        env:
          RUSTFLAGS: -C target-feature=+neon,+aes
        run: cargo test --no-default-features

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there. A library needs no source of random
  # numbers to be built: the program that links it names one.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    env:
      RUSTFLAGS: --cfg getrandom_backend="custom"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features alloc
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features suci
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features nai

  # A target that has the scalar code alone, and 32-bit lengths
  scalar:
    name: Test (32-bit x86, scalar code alone)
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Scalar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --target i686-unknown-linux-gnu --test implementation -- --nocapture
      - run: cargo test --target i686-unknown-linux-gnu

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      OXIRUSH_SECURITY_EXPECT: Vector256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features

  # The lowest version of each dependency that Cargo.toml allows: each set
  # of features on the host, and those without `std` on a target without it
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features alloc
      - run: cargo test --no-default-features --features std
      - run: cargo test --no-default-features --features suci
      - name: Build without std
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: |
          cargo build --target thumbv7em-none-eabihf --no-default-features
          cargo build --target thumbv7em-none-eabihf --no-default-features --features alloc
          cargo build --target thumbv7em-none-eabihf --no-default-features --features suci
          cargo build --target thumbv7em-none-eabihf --no-default-features --features nai

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features suci -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # As docs.rs builds it
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml

  fuzz:
    name: Fuzz ${{ matrix.target }} (1 minute)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [suci, suci_round_trip, identity, algorithms]
    env:
      # The target `algorithms` compares the vector paths with the scalar
      # code through the crate's hooks
      RUSTFLAGS: --cfg oxirush_security_hooks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The first directory takes what the run finds; the second has the seeds.
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - run: >
          cargo fuzz run ${{ matrix.target }}
          fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          -- -max_total_time=60 -max_len=512

  bench:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # Each benchmark once, without timing: the figures of a shared runner
      # say nothing
      - run: cargo test --manifest-path benches/Cargo.toml --benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
