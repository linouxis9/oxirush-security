name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --release
      # Each set of features: neither, `suci` alone, and both (the default)
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features suci

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --no-default-features

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features suci -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # As docs.rs builds it
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml

  fuzz:
    name: Fuzz ${{ matrix.target }} (1 minute)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [suci, suci_round_trip, identity, algorithms]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The first directory takes what the run finds; the second has the seeds.
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - run: >
          cargo fuzz run ${{ matrix.target }}
          fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          -- -max_total_time=60 -max_len=512

  bench:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      # Each benchmark once, without timing: the figures of a shared runner
      # say nothing
      - run: cargo test --manifest-path benches/Cargo.toml --benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
