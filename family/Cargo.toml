# The blocks of the README that use other crates of the family: oxirush-security with them,
# at the versions that this manifest names. A package of its own, so that the crate
# depends on none of them: nothing here is published. `cargo test` here runs the
# blocks and compares what they print with the README.
[package]
name = "oxirush-security-family"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dev-dependencies]
oxirush-security = { path = ".." }
oxirush-nas = { version = "0.5", features = ["security"] }
hex = "0.4"

# Not a member of a workspace that the crate may be in.
[workspace]

# oxirush-nas takes this oxirush-security.
[patch.crates-io]
oxirush-security = { path = ".." }
