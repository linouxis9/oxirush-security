# The Rust programs of compare.sh: oxirush-security, and the crates that
# compute the same functions, at the versions that this manifest pins, on
# the same inputs. A package of its own, which is not published: the crate
# depends on none of these.
[package]
name = "oxirush-security-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-security = { path = "../.." }
milenage = "=0.3.1"
milenage-0-1 = { package = "milenage", version = "=0.1.6" }
zuc = "=0.4.1"
cryptography-rs = "=0.8.0"
aes = "=0.8.4"
ctr = "=0.9.2"
cmac = "=0.7.2"

# Not a member of a workspace that the crate may be in.
[workspace]
