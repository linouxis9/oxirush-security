# The benchmarks and the profiler of oxirush-security. A package of its own,
# so that the crate keeps its few dependencies: nothing here is published.
[package]
name = "oxirush-security-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-security = { path = ".." }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
pprof = { version = "0.15", features = ["criterion", "protobuf-codec", "flamegraph"] }
# The MILENAGE that programs took before this crate had one, timed beside it
milenage = "=0.1.6"
# The version before this one, whose algorithms `version_0_2` times
oxirush-security-0-2 = { package = "oxirush-security", version = "=0.2.0" }

[[bench]]
name = "algorithms"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "milenage"
harness = false

[[bench]]
name = "version_0_2"
harness = false

# `--cfg oxirush_security_hooks` and `FORM=scalar` time the scalar code.
# `aes_force_soft` is what the `aes` crate of `milenage` takes for its code
# without the AES instructions.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(oxirush_security_hooks)', 'cfg(aes_force_soft)', 'cfg(aes_backend, values("soft"))'] }

# Symbols for the profiles.
[profile.bench]
debug = true

# Not a member of a workspace that the crate may be in.
[workspace]
