# What the public operations of oxirush-security leave on the stack and in
# the registers. A package of its own, which is not published: it reads its
# own stack, and takes the crate's hooks.
[package]
name = "oxirush-security-leftovers"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
oxirush-security = { path = ".." }
# The values to look for are computed apart from the crate
aes = "0.9.2"
sha2 = "0.11"
hex = "0.4.3"

# The operations as a program has them
[profile.release]
debug = 1

# Not a member of a workspace that the crate may be in.
[workspace]
