[package]
name = "oxirush-security"
version = "0.2.0"
edition = "2024"
description = "5GS and EPS security algorithms, key derivation, NAS ciphering, integrity, and SUCI"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-security"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "lte", "eps", "nas", "security"]
categories = ["cryptography", "network-programming"]
readme = "README.md"

[dependencies]
# KDF: HMAC-SHA-256
sha2 = "0.10"
hmac = "0.12"

# NIA2 (AES-CMAC) + NEA2 (AES-CTR)
aes = { version = "0.8", features = ["zeroize"] }
cipher = { version = "0.4", features = ["zeroize"] }

# SUCI concealment (TS 33.501 Annex C)
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Error handling
thiserror = "2"

# Key material zeroization
zeroize = { version = "1", features = ["derive"] }

# Constant-time comparison for SUCI MAC
subtle = "2"

# Hex encoding for SUCI scheme output
hex = "0.4"

# RFC 7542 requires NFC-normalized UTF-8 NAIs and RFC 5891 realms.
unicode-normalization = "0.1"
idna = "1"
base64 = "0.22"

[dev-dependencies]
