[package]
name = "oxirush-security"
version = "0.3.0"
edition = "2024"
description = "The security functions of 5GS and EPS, per 3GPP TS 35.206, TS 33.102, TS 33.501 and TS 33.401: MILENAGE, key derivation, NAS integrity and ciphering, and SUCI concealment"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-security"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "lte", "3gpp", "milenage", "suci"]
categories = ["cryptography", "network-programming", "no-std"]
readme = "README.md"
exclude = [".cargo/", ".github/", ".gitignore", "benches/", "differential/", "emulated-aarch64/", "fuzz/", "leftovers/"]

[features]
default = ["std", "suci", "nai"]
# The standard library. On AArch64 systems other than Linux, Android and
# Apple's, it is what asks the processor for its instructions when the
# program runs. Without it the crate is `no_std`.
std = ["alloc"]
# An allocator: what returns a `Vec` or a `String` (`kdf::build_s`,
# `tbcd_encode`, `tbcd_decode`) and `Supi::into_owned`. The algorithms, the
# keys and their derivations need none.
alloc = ["zeroize/alloc", "oxirush-utils/alloc"]
# SUCI concealment and deconcealment with the null scheme, Profile A (X25519)
# and Profile B (P-256), TS 33.501 Annex C. Concealment draws a key with
# `getrandom`, which needs a source of random numbers for the target.
suci = ["alloc", "dep:x25519-dalek", "dep:p256", "dep:getrandom"]
# The SUCI in the NAI format, TS 23.003 clause 28.7.3, and the SUCI of a SUPI
# that is a NAI: a network specific identifier, a GCI or a GLI. Its realm and
# its username are checked by the grammar of RFC 7542.
nai = ["suci"]
# The realm and the username of a NAI are also checked as internationalized
# names: Unicode normalization form C, and a realm that IDNA takes as it is
# written. It brings the Unicode tables of the `idna` of oxirush-utils, some
# forty crates, as the feature `idna` of oxirush-nas does.
idna = ["nai", "oxirush-utils/idna"]

[dependencies]
# KDF and SUCI: SHA-256 whose state is wiped on drop
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }

# NIA2 (AES-CMAC) + NEA2 (AES-CTR), with key schedules wiped on drop, and
# the AES round that is S1 of SNOW 3G and gives the S-box S1 of ZUC
aes = { version = "0.9.2", features = ["hazmat", "zeroize"] }

# Key material zeroization
zeroize = { version = "1.9", default-features = false }

# Constant-time comparison for SUCI MAC and constant_time_eq
subtle = { version = "2.6", default-features = false }

# `suci`: ECIES over X25519 and P-256 (TS 33.501 Annex C.3)
x25519-dalek = { version = "3", features = ["static_secrets"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "getrandom"], optional = true }
getrandom = { version = "0.4", optional = true }

# The identities: PLMN, 5G-GUTI, 5G-S-TMSI, SUPI, the two forms of a SUCI and
# the grammar of a NAI, with no feature of its own (`alloc` and `nai` above
# turn on those that they need). It adds no crate to the tree.
oxirush-utils = { version = "0.1.0", default-features = false }

# The instructions of the processor, asked without the standard library:
# CPUID on x86-64, the system on AArch64. `aes` has it in the tree already.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cpufeatures = "0.3"

[dev-dependencies]
hex = "0.4.3"

# `--cfg oxirush_security_hooks` gives the crate's own fuzz targets, its
# emulated AArch64 program and its scan of leftovers the module `hooks`,
# which turns the vector paths off so that they are compared with the scalar
# ones. No other build has it.
#
# `--cfg oxirush_security_unwiped` is for the program that cannot afford the
# clearing of the stack and of the registers after each operation: see
# "Key material and timing" in the documentation.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(oxirush_security_hooks)', 'cfg(oxirush_security_unwiped)'] }

[[example]]
name = "suci_conceal"
required-features = ["nai"]

[[test]]
name = "suci_validation"
required-features = ["suci"]

# docs.rs shows which feature an item needs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
