[package]
name = "oxirush-security"
version = "0.3.0"
edition = "2024"
description = "5GS and EPS security algorithms, key derivation, NAS ciphering, integrity, and SUCI"
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-security"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["5g", "lte", "eps", "nas", "security"]
categories = ["cryptography", "network-programming"]
readme = "README.md"
exclude = [".github/", ".gitignore"]

[dependencies]
# KDF and SUCI: SHA-256 whose state is wiped on drop
sha2 = { version = "0.11", features = ["zeroize"] }

# NIA2 (AES-CMAC) + NEA2 (AES-CTR), with key schedules wiped on drop
aes = { version = "0.9.2", features = ["zeroize"] }

# SUCI concealment (TS 33.501 Annex C)
x25519-dalek = { version = "3", features = ["static_secrets"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "getrandom"] }
getrandom = "0.4"

# Error handling
thiserror = "2"

# Key material zeroization
zeroize = { version = "1.9", features = ["derive"] }

# Constant-time comparison for SUCI MAC and constant_time_eq
subtle = "2.6"

# Hex encoding for SUCI scheme output
hex = "0.4"

# RFC 7542 requires NFC-normalized UTF-8 NAIs and RFC 5891 realms.
unicode-normalization = "0.1"
idna = "1"
base64 = "0.22"
